<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="35%" stop-color="#dc2626" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="appShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#450a0a" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" filter="url(#appShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#glowGrad)" />
  <rect x="26" y="26" width="460" height="460" rx="108" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center Decorative Glow Circle -->
  <circle cx="256" cy="246" r="150" fill="#ffffff" fill-opacity="0.08" />
  <circle cx="256" cy="246" r="115" fill="#fef08a" fill-opacity="0.06" />

  <!-- Graduation Cap & AI Crest Icon -->
  <g filter="url(#iconShadow)" transform="translate(256, 236) scale(1.15)">
    <!-- Graduation Cap Top Diamond -->
    <path d="M 0 -75 L 125 -25 L 0 25 L -125 -25 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Cap Skull Base -->
    <path d="M -75 2 L -75 42 C -75 78 75 78 75 42 L 75 2 C 55 18 -55 18 -75 2 Z" fill="#f8fafc" />

    <!-- Cap Tassel Band -->
    <circle cx="0" cy="-25" r="7" fill="url(#goldGrad)" />
    <path d="M 0 -25 C 60 -15 88 10 92 48" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <path d="M 88 48 L 96 48 L 94 75 L 90 75 Z" fill="url(#goldGrad)" />

    <!-- Glowing AI Sparkle Star on Cap -->
    <path d="M 0 -52 Q 0 -36 12 -36 Q 0 -36 0 -20 Q 0 -36 -12 -36 Q 0 -36 0 -52 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Bottom Brand Pill "EDUGENIUS" -->
  <g transform="translate(256, 412)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#facc15" stroke-width="2" stroke-opacity="0.8" />
    <text x="0" y="5" font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="3.5" text-anchor="middle">EDUGENIUS</text>
    <circle cx="82" cy="0" r="3.5" fill="#22c55e" />
  </g>
</svg>
