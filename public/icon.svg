<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant Yellow/Golden Background Gradient -->
    <linearGradient id="yellowBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Inner Gloss Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.25" />
    </linearGradient>

    <!-- Deep Red Cap Gradient -->
    <linearGradient id="redCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- App Shadow Filter -->
    <filter id="appShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#b45309" flood-opacity="0.35" />
    </filter>

    <!-- Cap Shadow Filter -->
    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#78350f" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background with Radiant Yellow Gradient -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#yellowBgGrad)" filter="url(#appShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#glossGrad)" />
  <rect x="26" y="26" width="460" height="460" rx="108" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" />

  <!-- Center Decorative Glow Circle -->
  <circle cx="256" cy="242" r="160" fill="#ffffff" fill-opacity="0.35" />
  <circle cx="256" cy="242" r="120" fill="#fef08a" fill-opacity="0.25" />

  <!-- Graduation Cap & Academic Crest Icon -->
  <g filter="url(#capShadow)" transform="translate(256, 230) scale(1.18)">
    <!-- Graduation Cap Top Diamond (Deep Red with Gold Trim) -->
    <path d="M 0 -78 L 130 -26 L 0 26 L -130 -26 Z" fill="url(#redCapGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Cap Skull Base -->
    <path d="M -80 3 L -80 44 C -80 82 80 82 80 44 L 80 3 C 60 20 -60 20 -80 3 Z" fill="#7f1d1d" stroke="#ffffff" stroke-width="2" />

    <!-- Cap Center Button -->
    <circle cx="0" cy="-26" r="8" fill="url(#goldAccentGrad)" stroke="#ffffff" stroke-width="1.5" />

    <!-- Flowing Tassel -->
    <path d="M 0 -26 C 65 -15 95 12 98 52" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <path d="M 0 -26 C 65 -15 95 12 98 52" fill="none" stroke="#b91c1c" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Tassel Brush -->
    <path d="M 94 52 L 102 52 L 100 80 L 96 80 Z" fill="url(#redCapGrad)" stroke="#ffffff" stroke-width="1.5" />

    <!-- Sparkling AI Star on Cap -->
    <path d="M 0 -54 Q 0 -38 12 -38 Q 0 -38 0 -22 Q 0 -38 -12 -38 Q 0 -38 0 -54 Z" fill="url(#goldAccentGrad)" />
  </g>

  <!-- Bottom Brand Pill "EDUGENIUS AI" -->
  <g transform="translate(256, 414)">
    <rect x="-115" y="-18" width="230" height="36" rx="18" fill="#0f172a" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" />
    <text x="0" y="5" font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="3" text-anchor="middle">EDUGENIUS AI</text>
    <circle cx="92" cy="0" r="3.5" fill="#22c55e" />
  </g>
</svg>
